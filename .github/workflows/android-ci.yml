name: Android CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;22.1.7171670'
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.10.2
      - name: Validate Gradle bootstrap
        run: gradle --version
      - name: Verify all Android launcher widget entries
        run: python3 scripts/verify_widget_catalog.py
      - name: Run unit tests, Android lint and debug build
        run: gradle --no-daemon clean testDebugUnitTest lint assembleDebug
      - name: Prepare app-name APK artifact
        if: always() && hashFiles('app/build/outputs/apk/debug/*.apk') != ''
        run: cp app/build/outputs/apk/debug/app-debug.apk "KairoAI-debug-${{ github.run_number }}.apk"
      - name: Upload debug APK for diagnostics
        if: always() && hashFiles('KairoAI-debug-${{ github.run_number }}.apk') != ''
        uses: actions/upload-artifact@v6
        with:
          name: KairoAI-debug-${{ github.run_number }}
          path: KairoAI-debug-${{ github.run_number }}.apk
          if-no-files-found: ignore
          retention-days: 7
