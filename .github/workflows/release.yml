name: Signed Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kairo-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;22.1.7171670'
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.10.2
      - name: Validate release tag and version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then echo "Tag vMAJOR.MINOR.PATCH formatında olmalı." >&2; exit 2; fi
          MAJOR="${BASH_REMATCH[1]}"; MINOR="${BASH_REMATCH[2]}"; PATCH="${BASH_REMATCH[3]}"
          if (( MINOR >= 1000 || PATCH >= 1000 )); then echo "MINOR ve PATCH değerleri 0..999 aralığında olmalı." >&2; exit 2; fi
          CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          if (( CODE <= 0 || CODE > 2100000000 )); then echo "Android versionCode sınır dışında." >&2; exit 2; fi
          echo "ORG_GRADLE_PROJECT_KAIRO_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_KAIRO_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
      - name: Require signing secrets and decode keystore
        shell: bash
        run: |
          set -euo pipefail
          for key in ANDROID_SIGNING_KEY_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then echo "Required GitHub Actions secret missing: $key" >&2; exit 2; fi
          done
          STORE="$RUNNER_TEMP/kairo-release.jks"
          printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          echo "ORG_GRADLE_PROJECT_KAIRO_STORE_FILE=$STORE" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_KAIRO_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_KAIRO_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_KAIRO_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          chmod 600 "$STORE"
      - name: Run tests and build release APK and AAB
        run: gradle --no-daemon clean testDebugUnitTest lint assembleRelease bundleRelease
      - name: Verify APK signature and create checksums
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          test -d "$SDK_ROOT/build-tools" || { echo "Android build-tools path bulunamadı: $SDK_ROOT" >&2; exit 2; }
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" "KairoAI-${GITHUB_REF_NAME}-signed.apk"
          cp app/build/outputs/bundle/release/app-release.aab "KairoAI-${GITHUB_REF_NAME}.aab"
          sha256sum "KairoAI-${GITHUB_REF_NAME}-signed.apk" "KairoAI-${GITHUB_REF_NAME}.aab" > SHA256SUMS.txt
          echo "apk=KairoAI-${GITHUB_REF_NAME}-signed.apk" >> "$GITHUB_OUTPUT"
      - name: Upload release build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kairo-ai-release-${{ github.ref_name }}
          path: |
            KairoAI-${{ github.ref_name }}-signed.apk
            KairoAI-${{ github.ref_name }}.aab
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release with signed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "KairoAI-${GITHUB_REF_NAME}-signed.apk" \
            "KairoAI-${GITHUB_REF_NAME}.aab" \
            SHA256SUMS.txt \
            --verify-tag \
            --title "Kairo AI ${GITHUB_REF_NAME}" \
            --generate-notes
